[theme]
base = "dark"
primaryColor = "#FFA028"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0d0d0d"
textColor = "#E6E6E6"
font = "monospace"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 25
